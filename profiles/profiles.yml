# Local and CI profile: runs the whole project on DuckDB with the synthetic
# sample data generated by scripts/generate_sample_data.py. No credentials.
#
# To run on BigQuery instead, copy profiles.yml.example to ~/.dbt/profiles.yml.
ecommerce_analytics:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'ecommerce.duckdb') }}"
      schema: analytics
      threads: 4
